packages:
  - "apps/api"
  - "apps/admin-web"
  - "packages/*"
overrides:
  "js-yaml@>=5.0.0 <=5.2.1": "5.2.2"
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "argon2"
  - "esbuild"
  - "lmdb"
  - "msgpackr-extract"
  - "prisma"
  - "unrs-resolver"
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
