services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: police_incidents
      POSTGRES_USER: police
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U police -d police_incidents"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://police:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/police_incidents?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/apps/api/uploads
    expose: ["3000"]
  admin-web:
    build:
      context: .
      dockerfile: infra/docker/admin-web.Dockerfile
    expose: ["80"]
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, admin-web]
volumes:
  postgres_data:
  uploads:
