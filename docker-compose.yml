services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-police_incident_system}
      MYSQL_USER: ${DATABASE_USER:-police_app}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
      SHADOW_DATABASE_NAME: ${SHADOW_DATABASE_NAME:-police_incident_shadow}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-police_incident_test}
      TEST_DATABASE_USER: ${TEST_DATABASE_USER:-police_test}
      TEST_DATABASE_PASSWORD: ${TEST_DATABASE_PASSWORD:?TEST_DATABASE_PASSWORD is required}
      TZ: UTC
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql://${DATABASE_USER:-police_app}:${DATABASE_PASSWORD}@mysql:3306/${DATABASE_NAME:-police_incident_system}
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/apps/api/uploads
    expose: ["3000"]
  admin-web:
    build:
      context: .
      dockerfile: infra/docker/admin-web.Dockerfile
    expose: ["80"]
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, admin-web]
volumes:
  mysql_data:
  uploads:
