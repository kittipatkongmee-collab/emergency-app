<h1 class="page-title">เปลี่ยนรหัสผ่าน</h1>
<form class="card settings" [formGroup]="form" (ngSubmit)="save()">
  <div class="field">
    <label for="current-password">รหัสผ่านปัจจุบัน</label
    ><input id="current-password" type="password" formControlName="currentPassword" />
  </div>
  <div class="field">
    <label for="new-password">รหัสผ่านใหม่</label
    ><input id="new-password" type="password" formControlName="newPassword" /><small class="muted"
      >อย่างน้อย 12 ตัวอักษร</small
    >
  </div>
  <button class="btn-primary" [disabled]="saving()">
    {{ saving() ? 'กำลังบันทึก…' : 'บันทึกรหัสผ่านใหม่' }}
  </button>
  @if (message()) {
    <p role="status">{{ message() }}</p>
  }
</form>
